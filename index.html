<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Atomic Orbital</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="info">
        <h1>3D ATOMIC ORBITAL</h1>

        <div id="status">
            Loading...
        </div>

        <p>
            Left mouse = rotate<br>
            Mouse wheel = zoom<br>
            P = pause rotation<br>
            R = regenerate
        </p>
    </div>

    <!--
        Older Three.js version intentionally used here.

        It supports the normal THREE global variable,
        so index.html can be opened directly.
    -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js">
    </script>

    <script src="script.js"></script>

</body>

</html>
